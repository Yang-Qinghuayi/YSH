name: 全平台打包发布

on:
  push:
    branches: [ysh]

jobs:
  # ── macOS ARM ──────────────────────────────────────────────────────────────
  macos-arm:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: 安装前端依赖
        run: pnpm install

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          tagName: build-${{ github.run_number }}
          releaseName: 'Build #${{ github.run_number }}'
          releaseBody: |
            自动构建
            - Commit: ${{ github.sha }}
            - 提交说明: ${{ github.event.head_commit.message }}
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin


  # ── Windows ────────────────────────────────────────────────────────────────
  windows:
    name: Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: pnpm install

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          tagName: build-${{ github.run_number }}
          releaseName: 'Build #${{ github.run_number }}'
          releaseBody: |
            自动构建
            - Commit: ${{ github.sha }}
            - 提交说明: ${{ github.event.head_commit.message }}
          releaseDraft: false
          prerelease: false

